<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD060"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E09010"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE080"/>
      <stop offset="100%" stop-color="#FFD060"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1628"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000066"/>
    </filter>
  </defs>

  <!-- Background hexagon -->
  <path d="M26 2L48 14.5V37.5L26 50L4 37.5V14.5L26 2Z"
    fill="url(#bg)" stroke="url(#gold)" stroke-width="1.3" stroke-opacity="0.7"/>
  <!-- Inner ring -->
  <path d="M26 6L44 16.5V35.5L26 46L8 35.5V16.5L26 6Z"
    stroke="url(#gold)" stroke-width="0.4" stroke-opacity="0.2" fill="none"/>

  <!-- Gift box shadow -->
  <rect x="11" y="27" width="30" height="19" rx="2.5" fill="#000" opacity="0.3" transform="translate(1,1)"/>

  <!-- Gift box body -->
  <rect x="11" y="26" width="30" height="19" rx="2.5" fill="url(#gold)" filter="url(#glow)"/>
  <!-- Body shine -->
  <rect x="11" y="26" width="30" height="8" rx="2.5" fill="url(#goldLight)" opacity="0.5"/>

  <!-- Gift box lid -->
  <rect x="9.5" y="19" width="33" height="8" rx="2.5" fill="url(#goldLight)" filter="url(#glow)"/>
  <!-- Lid shine -->
  <rect x="9.5" y="19" width="33" height="3.5" rx="2.5" fill="white" opacity="0.12"/>

  <!-- Ribbon vertical -->
  <rect x="23" y="19" width="6" height="26" rx="1.5" fill="#C07800" opacity="0.55"/>

  <!-- Ribbon horizontal on lid -->
  <rect x="9.5" y="22.5" width="33" height="4" rx="0.5" fill="#C07800" opacity="0.45"/>

  <!-- Bow left -->
  <path d="M26 19 C21 10, 11 9, 13.5 16.5 C15 20, 23.5 20, 26 19Z"
    fill="url(#goldLight)" filter="url(#glow)"/>
  <!-- Bow right -->
  <path d="M26 19 C31 10, 41 9, 38.5 16.5 C37 20, 28.5 20, 26 19Z"
    fill="url(#gold)" filter="url(#glow)"/>
  <!-- Bow center knot -->
  <circle cx="26" cy="19" r="3" fill="#FFE080" filter="url(#glow)"/>
  <circle cx="26" cy="19" r="1.5" fill="white" opacity="0.4"/>

  <!-- USDC coin -->
  <circle cx="38" cy="38" r="7" fill="#060A12" stroke="url(#gold)" stroke-width="1.3"/>
  <circle cx="38" cy="38" r="5" fill="none" stroke="url(#gold)" stroke-width="0.4" stroke-opacity="0.3"/>
  <text x="38" y="42" text-anchor="middle" font-family="monospace" font-size="8" font-weight="900" fill="url(#gold)">$</text>
</svg>
